<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Channel Studio Self-tests</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f3f3f1;
        --ink: #1c1e22;
        --good: #1d7a45;
        --bad: #b3261e;
        --line: #dddbd6;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #131417;
          --ink: #ebebea;
          --good: #6fd39a;
          --bad: #ff8a80;
          --line: #32363c;
        }
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 16px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0 auto;
        padding: 1.5rem 16px;
        max-width: 900px;
      }
      h1 { margin: 0 0 0.25rem; }
      #summary { font-size: 1.2rem; font-weight: 700; margin: 0.5rem 0 1rem; }
      #summary.pass { color: var(--good); }
      #summary.fail { color: var(--bad); }
      h2 { font-size: 1rem; margin: 1.5rem 0 0.25rem; border-bottom: 1px solid var(--line); }
      li { margin: 0.15rem 0; }
      .ok::marker { content: '✓  '; color: var(--good); }
      .ko { color: var(--bad); }
      .ko::marker { content: '✗  '; }
      pre { white-space: pre-wrap; font-size: 0.85rem; margin: 0.25rem 0 0.5rem; }
      a { color: inherit; }
    </style>
  </head>
  <body>
    <h1>Channel Studio self-tests</h1>
    <p><a href="../index.html">← Back to the app</a></p>
    <p id="summary">Running…</p>
    <div id="out"></div>
    <script type="module" src="tests.js"></script>
  </body>
</html>
